name: Claude on demand

on:
  workflow_call:
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

jobs:
  claude:
    runs-on: ubuntu-latest
    # Only guard against a stuck run — the on-demand path has no --max-turns cap.
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # RUNNER_TEMP, never the checkout: the action switches branches mid-run,
      # and a branch that tracks this path would abort that checkout.
      - name: Fetch the shared review rubric
        run: |
          curl -fsSL --retry 3 \
            https://raw.githubusercontent.com/edward-sia/.github/main/claude-review.md \
            -o "$RUNNER_TEMP/claude-review.md"

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --model sonnet
            --append-system-prompt "When asked to review a PR, first read ${{ runner.temp }}/claude-review.md and follow it as the review rubric. It is the file review comments may still refer to as .github/claude-review.md."
