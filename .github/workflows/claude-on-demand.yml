name: Claude on demand

on:
  workflow_call:
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

jobs:
  claude:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # RUNNER_TEMP, never the checkout: the action switches branches mid-run,
      # and a branch that tracks this path would abort that checkout.
      - name: Fetch the shared review rubric
        run: |
          curl -fsSL --retry 3 \
            https://raw.githubusercontent.com/edward-sia/.github/main/claude-review.md \
            -o "$RUNNER_TEMP/claude-review.md"

      - name: Load pull request review context
        id: pr-context
        if: |
          github.event_name == 'pull_request' ||
          (github.event_name == 'issue_comment' && github.event.issue.pull_request) ||
          github.event_name == 'pull_request_review_comment' ||
          github.event_name == 'pull_request_review'
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number || '' }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number || '' }}
        run: |
          if [ "$EVENT_NAME" = 'issue_comment' ]; then
            pr_number=$ISSUE_NUMBER
          else
            pr_number=$PULL_REQUEST_NUMBER
          fi
          [ -n "$pr_number" ] || {
            echo "::error title=Review routing::could not determine the pull request number"
            exit 1
          }

          pr_json="$RUNNER_TEMP/claude-pr.json"
          labels_path="$RUNNER_TEMP/claude-pr-labels.txt"
          paths_path="$RUNNER_TEMP/claude-review-paths.txt"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$pr_number" > "$pr_json"
          jq -r '.labels[].name' "$pr_json" > "$labels_path"
          gh api --paginate \
            "/repos/$GITHUB_REPOSITORY/pulls/$pr_number/files?per_page=100" \
            --jq '.[].filename' > "$paths_path"
          {
            echo "labels_path=$labels_path"
            echo "changed_files=$(jq -r '.changed_files' "$pr_json")"
            echo "additions=$(jq -r '.additions' "$pr_json")"
            echo "deletions=$(jq -r '.deletions' "$pr_json")"
            echo "paths_path=$paths_path"
          } >> "$GITHUB_OUTPUT"

      - name: Pick the review profile from the trigger and pull request
        id: profile
        env:
          TRIGGER_TEXT: ${{ github.event.comment.body || github.event.review.body }}
          PR_LABELS_FILE: ${{ steps.pr-context.outputs.labels_path }}
          PR_CHANGED_FILES: ${{ steps.pr-context.outputs.changed_files || 0 }}
          PR_ADDITIONS: ${{ steps.pr-context.outputs.additions || 0 }}
          PR_DELETIONS: ${{ steps.pr-context.outputs.deletions || 0 }}
          PR_PATHS_FILE: ${{ steps.pr-context.outputs.paths_path }}
        run: |
          changed_lines=$((PR_ADDITIONS + PR_DELETIONS))
          has_sonnet_label=false
          has_opus_label=false
          if [ -n "${PR_LABELS_FILE:-}" ]; then
            grep -Fxiq 'claude:sonnet' "$PR_LABELS_FILE" && has_sonnet_label=true
            grep -Fxiq 'claude:opus' "$PR_LABELS_FILE" && has_opus_label=true
          else
            grep -Fxiq 'claude:sonnet' <<<"${PR_LABELS:-}" && has_sonnet_label=true
            grep -Fxiq 'claude:opus' <<<"${PR_LABELS:-}" && has_opus_label=true
          fi

          sensitive_path_regex='(^|/)(auth|authentication|authorization|authn|authz|oauth|oidc|sso|identity|iam|rbac|acl|permissions?|polic(y|ies)|sessions?|tokens?|secrets?|credentials?|keys?|certificates?|certs?|crypto|encryption|payment|payments|billing|checkout|stripe|database|db|schemas?|migrations?|prisma)(/|$|[._-])|(^|/)(infra|infrastructure|deploy|deployment|terraform|pulumi|cloudformation|k8s|kubernetes|helm|ansible|serverless|docker)(/|$)|(^|/)(package\.json|package-lock\.json|pnpm-lock\.yaml|yarn\.lock|bun\.lockb?|requirements[^/]*\.txt|pyproject\.toml|poetry\.lock|go\.mod|go\.sum|Cargo\.toml|Cargo\.lock|pom\.xml|build\.gradle(\.kts)?|Dockerfile[^/]*|docker-compose[^/]*\.ya?ml|Makefile|justfile|Taskfile\.ya?ml|\.gitlab-ci\.ya?ml|Jenkinsfile|azure-pipelines\.ya?ml|bitbucket-pipelines\.ya?ml|buildkite\.ya?ml|\.circleci/config\.ya?ml|\.env(\.[^/]*)?|\.npmrc|\.pypirc|\.mcp\.json|\.claude\.json)$|(^|/)\.github/(workflows|actions)/|(^|/)CODEOWNERS$|(^|/)(\.aws|\.kube|\.claude)(/|$)|(^|/)(CLAUDE|AGENTS)\.md$|^docs/superpowers/(specs|plans)/'
          sensitive_path_match=false
          if [ -n "${PR_PATHS_FILE:-}" ]; then
            grep -Eiq "$sensitive_path_regex" "$PR_PATHS_FILE" && sensitive_path_match=true
          else
            grep -Eiq "$sensitive_path_regex" <<<"${PR_PATHS:-}" && sensitive_path_match=true
          fi

          if "$has_sonnet_label" && "$has_opus_label"; then
            echo "::error title=Review routing::remove one of the conflicting labels: claude:sonnet or claude:opus"
            exit 1
          elif "$has_sonnet_label"; then
            model='sonnet'; timeout=15; reason='claude:sonnet label'
          elif "$has_opus_label"; then
            model='opus[1m]'; timeout=30; reason='claude:opus label'
          elif grep -Eiqw 'opus|deep|deeply|thorough|thoroughly|widely|extensive|extensively' <<<"$TRIGGER_TEXT"; then
            model='opus[1m]'; timeout=30; reason='trigger request'
          elif [ "$PR_CHANGED_FILES" -gt 25 ] || [ "$changed_lines" -gt 800 ]; then
            model='opus[1m]'; timeout=30; reason='large pull request'
          elif "$sensitive_path_match"; then
            model='opus[1m]'; timeout=30; reason='sensitive or planning path'
          else
            model='sonnet'; timeout=15; reason='standard review'
          fi
          {
            echo "model=$model"
            echo "timeout=$timeout"
            echo "reason=$reason"
          } >> "$GITHUB_OUTPUT"
          echo "::notice title=Review profile::model=$model, timeout=${timeout}m, reason=$reason"

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        timeout-minutes: ${{ fromJSON(steps.profile.outputs.timeout) }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # A prompt puts Claude into automation mode only for a newly opened
          # pull request. Existing @claude interactions remain in tag mode.
          prompt: ${{ github.event_name == 'pull_request' && github.event.action == 'opened' && format('Review pull request {0} in {1}. Do not modify files, create branches, or commit changes. Post only review findings that follow the shared review rubric.', github.event.pull_request.number, github.repository) || '' }}
          # The action hides Claude's message stream by default, which also hides
          # whether the rubric below was read. Show it only where the Actions log
          # is private — the stream carries file contents, diffs and MCP payloads.
          show_full_output: ${{ github.event.repository.private }}
          claude_args: |
            --model ${{ steps.profile.outputs.model }}
            --append-system-prompt "When asked to review a PR, first read ${{ runner.temp }}/claude-review.md and follow it as the review rubric. It is the file review comments may still refer to as .github/claude-review.md."
